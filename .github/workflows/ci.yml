name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - uses: extractions/setup-just@v2
      # golangci-lint is not installed here, so `just lint` uses its
      # go vet + gofmt fallback.
      - run: just test
      - run: just lint
      - uses: pnpm/action-setup@v4
        with:
          version: 12.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: just fe-install
      - run: just fe-lint
      - run: just fe-test
      - run: just fe-build
