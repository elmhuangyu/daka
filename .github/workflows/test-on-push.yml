name: Test on Push

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

env:
  GOIMPORTS_VERSION: latest
  GOLANGCI_LINT_VERSION: latest
  NODE_VERSION: 26
  PNPM_VERSION: 12.17.0

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: backend/go.mod
        cache-dependency-path: backend/go.sum

    - name: Download dependencies
      run: go mod download

    - name: Install goimports
      run: go install golang.org/x/tools/cmd/goimports@${{ env.GOIMPORTS_VERSION }}

    - name: Install golangci-lint
      run: curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b $(go env GOPATH)/bin ${{ env.GOLANGCI_LINT_VERSION }}

    - name: Format check
      run: |
        out="$($(go env GOPATH)/bin/goimports -local github.com/elmhuangyu/daka/backend -l .)"
        if [ -n "$out" ]; then echo "goimports needed on:" >&2; echo "$out" >&2; exit 1; fi

    - name: Lint check
      run: $(go env GOPATH)/bin/golangci-lint run ./...

    - name: Build
      run: go build ./...

    - name: Run tests
      run: go test -race ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v7

    - name: Set up pnpm
      uses: pnpm/setup@v3
      with:
        version: ${{ env.PNPM_VERSION }}
        runtime: node@${{ env.NODE_VERSION }}

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Lint check
      run: pnpm run lint

    - name: Format check
      run: pnpm run fmt:check

    - name: Run tests
      run: pnpm run test

    - name: Build
      run: pnpm run build
